[package]
name = "discogs_fetch_master"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
libactions = { path = "../libactions" }
anyhow = "1"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
